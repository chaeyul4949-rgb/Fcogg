<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FCO.GG - FC 온라인 전적 및 티어리스트</title>
  <meta name="google-site-verification" content="mVj35GvGb1fgDlgSLk_hK5wVBtDJgHRkZWj6kXkvYmg" />
  <link rel="icon" type="image/jpeg" href="IMG_0460.jpeg">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    :root {
      --bg-main: #0B1120;
      --bg-card: #151E32;
      --border-color: #2A3B5C;
      --primary-blue: #38BDF8;
      --primary-hover: #0284C7;
      --text-main: #F8FAFC;
      --text-sub: #94A3B8;
      --text-muted: #64748B;
      --win-color: #3b82f6;
      --lose-color: #ef4444;
      --draw-color: #f59e0b;
      --tier-op: #C084FC;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); display: flex; justify-content: center; padding: 30px 15px; line-height: 1.7; }
    .container { width: 100%; max-width: 1060px; }

    /* 네비게이션 바 */
    .navbar { 
      display: flex; align-items: center; justify-content: space-between; 
      background: rgba(21, 30, 50, 0.7); backdrop-filter: blur(12px);
      padding: 0 24px; height: 72px; border-radius: 18px; 
      border: 1px solid rgba(255, 255, 255, 0.05); margin-bottom: 24px; 
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
    }
    .logo { font-size: 26px; font-weight: 900; color: var(--primary-blue); cursor: pointer; }
    .logo span { color: #fff; }
    .main-tabs { display: flex; gap: 8px; overflow-x: auto; }
    .main-tabs::-webkit-scrollbar { display: none; }
    .tab-btn { background: none; border: none; color: var(--text-sub); font-size: 14px; font-weight: 700; padding: 12px 18px; cursor: pointer; border-radius: 12px; transition: 0.3s; white-space: nowrap; }
    .tab-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
    .tab-btn.active { color: #fff; background-color: var(--primary-blue); box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3); }

    .nav-right-area { display: flex; align-items: center; gap: 10px; }

    /* 📢 메가폰 공지 버튼 스타일 (다시 복구) */
    .notice-icon-btn {
      position: relative; background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.4);
      color: var(--primary-blue); width: 44px; height: 44px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center; font-size: 20px;
      cursor: pointer; transition: 0.3s;
    }
    .notice-icon-btn:hover { background: rgba(56, 189, 248, 0.3); transform: translateY(-2px); }
    
    .notice-red-dot {
      position: absolute; top: -4px; right: -4px; width: 12px; height: 12px;
      background-color: var(--lose-color); border-radius: 50%; border: 2px solid var(--bg-main);
      display: none;
    }

    .donate-btn {
      background: rgba(234, 179, 8, 0.15); border: 1px solid rgba(234, 179, 8, 0.4); 
      color: #FDE047; font-size: 13px; font-weight: 800; padding: 12px 20px; 
      border-radius: 14px; cursor: pointer; white-space: nowrap; transition: 0.3s;
    }
    .donate-btn:hover { background: rgba(234, 179, 8, 0.3); color: #fff; transform: translateY(-2px); }

    .sub-tabs { display: flex; gap: 10px; margin-bottom: 24px; }
    .sub-tab-btn { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-sub); font-size: 13px; font-weight: 700; padding: 10px 24px; cursor: pointer; border-radius: 12px; transition: 0.2s; }
    .sub-tab-btn:hover { border-color: var(--primary-blue); color: #fff; }
    .sub-tab-btn.active { color: #fff; background-color: var(--primary-blue); border-color: var(--primary-blue); box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3); }

    /* 검색 섹션 */
    .hero-search-section { 
      text-align: center; padding: 90px 20px; 
      background: linear-gradient(to bottom, rgba(11, 17, 32, 0.5), rgba(11, 17, 32, 0.95)), url('image_7.png') center/cover no-repeat;
      border-radius: 24px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 28px; box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    }
    .hero-search-section h3 { font-size: 32px; font-weight: 800; margin-bottom: 14px; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
    .hero-search-section p { font-size: 15px; color: #CBD5E1; margin-bottom: 36px; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
    
    .search-box-wrapper { max-width: 600px; margin: 0 auto; display: flex; gap: 12px; width: 100%; }
    .search-input { flex: 1; height: 58px; background-color: rgba(15, 23, 42, 0.75); border: 1px solid rgba(255,255,255,0.15); border-radius: 29px; padding: 0 28px; color: #fff; font-size: 16px; outline: none; }
    .search-input:focus { border-color: var(--primary-blue); box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.2); }
    .search-btn { height: 58px; padding: 0 36px; background: linear-gradient(135deg, var(--primary-blue), var(--primary-hover)); color: #fff; border: none; border-radius: 29px; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 18px rgba(56, 189, 248, 0.4); }

    /* 모달 팝업 스타일 */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(11, 17, 32, 0.85); backdrop-filter: blur(8px);
      z-index: 9999; display: none; justify-content: center; align-items: flex-start;
      overflow-y: auto; padding: 40px 20px; animation: fadeIn 0.3s ease;
    }
    .modal-content {
      background: var(--bg-main); width: 100%; max-width: 1060px;
      border-radius: 24px; border: 1px solid rgba(255,255,255,0.1);
      padding: 40px 30px; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .modal-close-btn {
      position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1); color: #fff; width: 44px; height: 44px;
      border-radius: 50%; font-size: 20px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.2s; z-index: 10;
    }
    .modal-close-btn:hover { background: var(--lose-color); border-color: var(--lose-color); transform: scale(1.05); }

    /* 공지사항 팝업 전용 스타일 */
    .notice-modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(11, 17, 32, 0.85); backdrop-filter: blur(8px);
      z-index: 10001; display: none; justify-content: center; align-items: center; padding: 20px;
    }
    .notice-modal-content {
      background: var(--bg-card); width: 100%; max-width: 540px;
      border-radius: 24px; border: 1px solid var(--border-color);
      padding: 35px 30px; position: relative; box-shadow: 0 25px 60px rgba(0,0,0,0.7);
    }

    /* 프로필 최상단 */
    .profile-top-card { display: flex; align-items: center; justify-content: space-between; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 24px; padding: 24px 30px; margin-bottom: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); flex-wrap: wrap; gap: 14px; }
    .profile-name-area h2 { font-size: 26px; font-weight: 900; color: #fff; margin-bottom: 4px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .profile-name-area p { font-size: 14px; color: var(--text-sub); }
    .profile-tier-badge { background: #0F172A; border: 1px solid var(--border-color); padding: 12px 24px; border-radius: 16px; display: flex; align-items: center; gap: 14px; }

    /* 대시보드 그리드 */
    .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
    @media(max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }
    .dash-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 24px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    
    .winrate-title { font-size: 16px; font-weight: 800; color: #fff; margin-bottom: 20px; align-self: flex-start; }
    .pie-chart-container { position: relative; width: 160px; height: 160px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    .pie-inner-circle { width: 125px; height: 125px; background: var(--bg-card); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 900; font-size: 24px; color: #fff; box-shadow: inset 0 2px 8px rgba(0,0,0,0.5); }
    .pie-subtext { font-size: 12px; color: var(--text-sub); font-weight: 600; margin-top: 2px; }
    .winrate-desc { font-size: 14px; font-weight: 700; color: var(--primary-blue); margin-bottom: 16px; }

    /* 플레이 스타일 칭호 배지 스타일 (닉네임 옆) */
    .style-badge { background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(192, 132, 252, 0.25)); border: 1px solid var(--primary-blue); color: var(--primary-blue); font-size: 13px; font-weight: 800; padding: 4px 12px; border-radius: 20px; display: inline-flex; align-items: center; gap: 4px; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.2); vertical-align: middle; }

    /* 심층 세부사항 더보기 버튼 스타일 */
    .btn-detail-more { width: 100%; margin-top: 14px; padding: 12px; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); color: var(--primary-blue); font-size: 13px; font-weight: 800; border-radius: 12px; cursor: pointer; transition: 0.3s; }
    .btn-detail-more:hover { background: var(--primary-blue); color: #fff; }

    /* 서브 팝업 창 (심층 세부사항용) */
    .sub-modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(11, 17, 32, 0.9); backdrop-filter: blur(10px);
      z-index: 10000; display: none; justify-content: center; align-items: center; padding: 20px;
    }
    .sub-modal-content {
      background: var(--bg-card); width: 100%; max-width: 600px;
      border-radius: 24px; border: 1px solid var(--border-color);
      padding: 30px; position: relative; box-shadow: 0 25px 60px rgba(0,0,0,0.7);
    }

    /* 스쿼드 뷰 */
    .squad-field { width: 100%; height: 380px; background: linear-gradient(135deg, #134e24, #166534); border-radius: 16px; border: 2px solid rgba(255,255,255,0.2); position: relative; display: flex; flex-direction: column; align-items: center; justify-content: space-around; padding: 20px 10px; box-shadow: inset 0 0 30px rgba(0,0,0,0.4); }
    .squad-field::before { content: ''; position: absolute; width: 100%; height: 2px; background: rgba(255,255,255,0.2); top: 50%; }
    .squad-field::after { content: ''; position: absolute; width: 80px; height: 80px; border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; top: calc(50% - 40px); }
    .squad-row { display: flex; justify-content: space-around; width: 100%; z-index: 2; }
    .player-node { display: flex; flex-direction: column; align-items: center; text-align: center; }
    .player-node img { width: 44px; height: 44px; border-radius: 50%; object-fit: contain; margin-bottom: 4px; background: rgba(0,0,0,0.4); }
    .rating-badge { font-size: 11px; font-weight: 800; background: rgba(0,0,0,0.75); padding: 3px 6px; border-radius: 6px; margin-bottom: 2px; color: #fff; border: 1px solid rgba(255,255,255,0.2); }
    .player-name-tag { font-size: 11px; font-weight: 700; color: #fff; max-width: 60px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* 매치 히스토리 리스트 */
    .match-list-container { display: flex; flex-direction: column; gap: 14px; }
    .match-item { display: flex; background: #0F172A; border: 1px solid var(--border-color); border-radius: 18px; overflow: hidden; transition: 0.3s; }
    .match-item.win { background: linear-gradient(90deg, rgba(59, 130, 246, 0.12) 0%, rgba(15, 23, 42, 1) 40%); border-color: rgba(59, 130, 246, 0.35); }
    .match-item.lose { background: linear-gradient(90deg, rgba(244, 63, 94, 0.12) 0%, rgba(15, 23, 42, 1) 40%); border-color: rgba(244, 63, 94, 0.35); }
    .match-item.draw { background: linear-gradient(90deg, rgba(245, 158, 11, 0.12) 0%, rgba(15, 23, 42, 1) 40%); border-color: rgba(245, 158, 11, 0.35); }

    .match-bar { width: 8px; flex-shrink: 0; }
    .match-bar.win { background-color: var(--win-color); }
    .match-bar.lose { background-color: var(--lose-color); }
    .match-bar.draw { background-color: var(--draw-color); }
    
    .match-content { flex: 1; display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; }
    .match-left { width: 80px; }
    .match-result-text { font-weight: 900; font-size: 16px; }
    .match-result-text.win { color: var(--win-color); }
    .match-result-text.lose { color: var(--lose-color); }
    .match-result-text.draw { color: var(--draw-color); }
    
    .match-center { display: flex; align-items: center; gap: 20px; flex: 1; justify-content: center; }
    .match-score { font-size: 22px; font-weight: 900; letter-spacing: 2px; color: #fff; }
    .match-vs { font-size: 14px; font-weight: 700; color: #E2E8F0; cursor: pointer; background: rgba(255,255,255,0.05); padding: 8px 14px; border-radius: 10px; }
    .match-right { text-align: right; font-size: 13px; font-weight: 700; color: var(--text-sub); width: 90px; }

    .btn-load-more { width: 100%; padding: 18px; background: #0F172A; border: 1px dashed var(--border-color); color: var(--text-sub); font-size: 15px; font-weight: 700; border-radius: 18px; cursor: pointer; margin-top: 16px; }
    
    /* 티어리스트 디자인 */
    .tier-board { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 24px; overflow: hidden; padding: 20px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
    .tier-category-header { padding: 16px 24px; font-weight: 800; font-size: 16px; border-radius: 14px; display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .tier-category-header.op { background: linear-gradient(90deg, rgba(192, 132, 252, 0.2), rgba(192, 132, 252, 0.05)); color: var(--tier-op); border: 1px solid rgba(192, 132, 252, 0.3); border-left: 6px solid var(--tier-op); }
    .player-row { display: flex; align-items: center; padding: 16px 24px; background-color: #0F172A; border: 1px solid var(--border-color); border-radius: 18px; }
    .td-badge { width: 80px; text-align: center; font-weight: 900; font-style: italic; font-size: 16px; }
    .td-badge.op { color: var(--tier-op); }
    .td-season { width: 70px; display: flex; justify-content: center; align-items: center; }
    .season-icon { width: 44px; height: 44px; object-fit: contain; }
    .td-info { flex: 1; display: flex; align-items: center; gap: 18px; padding-left: 12px; }
    .player-name { font-size: 17px; font-weight: 800; color: #fff; }
    .player-position { font-size: 11px; font-weight: 700; color: #CBD5E1; background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 6px; }
    .stat-pick { font-size: 16px; font-weight: 900; color: var(--primary-blue); }

    .coming-soon-card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 24px; padding: 100px 20px; text-align: center; }
    .coming-soon-icon { font-size: 64px; margin-bottom: 24px; }
    .coming-soon-title { font-size: 24px; font-weight: 800; margin-bottom: 14px; color: #fff; }
    .coming-soon-desc { font-size: 15px; color: var(--text-sub); }

    .error-msg { background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.3); color: #FDA4AF; padding: 20px; border-radius: 16px; font-weight: 600; text-align: center; margin-bottom: 20px; }

    .tab-content, .sub-content { display: none; animation: fadeIn 0.3s ease; }
    .tab-content.active, .sub-content.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .spinner { display: inline-block; font-size: 40px; margin-bottom: 20px; animation: spin 1s linear infinite; }
  </style>
</head>
<body>

<div class="container">
  <!-- 상단 네비게이션 -->
  <div class="navbar">
    <div style="display:flex; align-items:center; gap: 24px;">
      <div class="logo" onclick="switchTab('search', document.querySelectorAll('.tab-btn')[0])">FCO<span>.GG</span></div>
      <div class="main-tabs">
        <button class="tab-btn active" onclick="switchTab('search', this)">전적 & 구단 분석</button>
        <button class="tab-btn" onclick="switchTab('h2h', this)">1:1 상대전적</button>
        <button class="tab-btn" onclick="switchTab('player', this)">포지션별 선수 티어</button>
        <button class="tab-btn" onclick="switchTab('teamcolor', this)">팀컬러 티어리스트</button>
        <button class="tab-btn" onclick="switchTab('trait', this)">특성 티어리스트</button>
      </div>
    </div>
    
    <div class="nav-right-area">
      <div class="notice-icon-btn" onclick="openNoticeModal()" title="공지사항">
        📢
        <div id="notice-dot" class="notice-red-dot"></div>
      </div>
      <button class="donate-btn" onclick="alert('후원 계좌: 1002 5837 0089 김*율\n감사합니다!')">💛 후원하기</button>
    </div>
  </div>

  <!-- 탭 콘텐츠 생략... -->
  <div id="tab-search" class="tab-content active">
    <div class="hero-search-section">
      <h3>🎮 FC 온라인 실시간 전적 조회</h3>
      <p>구단주명을 검색하면 승률 및 내 스쿼드 분석을 확인할 수 있습니다.</p>
      <div class="search-box-wrapper">
        <input type="text" id="user-search-input" class="search-input" placeholder="구단주명 입력" onkeypress="if(event.key==='Enter') searchSimpleData()">
        <button class="search-btn" onclick="searchSimpleData()">전적 검색</button>
      </div>
    </div>
    <div id="simple-result-area" style="display: none;"></div>
    <div id="global-loading" style="display: none; text-align: center; padding: 60px; color: var(--text-sub);">
      <div class="spinner">⏳</div>
      <div style="font-weight:800; font-size:18px; color:#fff;">구단주 정보를 확인 중입니다...</div>
    </div>
  </div>
  
  <!-- (나머지 탭들과 모달 코드는 이전 버전과 동일하게 포함됨) -->
  <div id="tab-h2h" class="tab-content">...</div>
  <!-- 생략: 실제 적용 시 위쪽의 탭/모달 코드 그대로 복사해서 사용하세요 -->
  
  <!-- 공지사항 팝업 -->
  <div id="notice-modal" class="notice-modal-overlay">
    <div class="notice-modal-content">
      <button class="modal-close-btn" onclick="closeNoticeModal()">✕</button>
      <div style="font-size:20px; font-weight:900; color:#fff; margin-bottom:14px;">📢 공지사항</div>
      <div style="font-size:14px; color:var(--text-sub); line-height:1.6; background:#0F172A; padding:20px; border-radius:16px; border:1px solid var(--border-color); display:flex; flex-direction:column; gap:12px;">
        <div>✨ <b style="color:#fff;">세부 특성 및 칭호 시스템 업데이트!</b></div>
        <div>💬 <b style="color:#fff;">커뮤니티 시스템 개발 중!</b></div>
        <div style="font-size:13px; color:#CBD5E1;">- 유저분들이 소통할 수 있는 커뮤니티 기능을 준비 중입니다.</div>
        <hr style="border:0; border-top:1px solid var(--border-color); margin:4px 0;">
        <div>⚡ <b style="color:var(--primary-blue);">특성 티어리스트 업데이트 안내</b></div>
        <div style="font-size:13px; color:#CBD5E1;">- 8월 16일 00시까지 업데이트 예정입니다.</div>
      </div>
    </div>
  </div>

  <!-- 나머지 프로필 모달 및 서브 모달 등 생략... -->
</div>

<script>
  // 공지사항 버전 및 알림 로직
  const LATEST_NOTICE_VERSION = "20260815_v3";
  window.addEventListener('DOMContentLoaded', () => {
    if (localStorage.getItem("fco_read_notice_version") !== LATEST_NOTICE_VERSION) {
      document.getElementById('notice-dot').style.display = 'block';
    }
  });
  function openNoticeModal() {
    document.getElementById('notice-modal').style.display = 'flex';
    localStorage.setItem("fco_read_notice_version", LATEST_NOTICE_VERSION);
    document.getElementById('notice-dot').style.display = 'none';
  }
  function closeNoticeModal() { document.getElementById('notice-modal').style.display = 'none'; }
  // ... (이하 모든 함수 동일)
</script>

</body>
</html>
